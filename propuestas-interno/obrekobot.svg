<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" shape-rendering="crispEdges" preserveAspectRatio="xMidYMid meet">
  <!-- Fondo navy oscuro -->
  <rect width="32" height="32" fill="#171b27"/>
  <!-- Suelo oscuro cálido -->
  <rect x="6" y="29" width="20" height="1" fill="#2a1f1a"/>
  <rect x="4" y="30" width="24" height="2" fill="#1c1612"/>

  <!-- Antena -->
  <rect x="15" y="2" width="2" height="1" fill="#ffcc44"/>
  <rect x="15" y="3" width="2" height="2" fill="#6a7080"/>

  <!-- ─── CABEZA ─── -->
  <!-- Top arco -->
  <rect x="11" y="5" width="10" height="1" fill="#9098a8"/>
  <rect x="10" y="6" width="12" height="1" fill="#9098a8"/>
  <!-- Bordes y cara -->
  <rect x="10" y="7" width="1" height="5" fill="#3a4050"/>
  <rect x="21" y="7" width="1" height="5" fill="#3a4050"/>
  <rect x="11" y="7" width="10" height="5" fill="#6a7080"/>
  <!-- Visor (banda oscura) -->
  <rect x="12" y="8" width="8" height="3" fill="#1f2532"/>
  <!-- Ojos amarillos brillantes -->
  <rect x="13" y="9" width="2" height="2" fill="#ffcc44"/>
  <rect x="17" y="9" width="2" height="2" fill="#ffcc44"/>
  <rect x="13" y="9" width="1" height="1" fill="#fff4c8"/>
  <rect x="17" y="9" width="1" height="1" fill="#fff4c8"/>
  <!-- Mentón / mandíbula -->
  <rect x="11" y="11" width="10" height="1" fill="#3a4050"/>
  <rect x="12" y="12" width="8" height="1" fill="#4d5360"/>

  <!-- Cuello -->
  <rect x="14" y="13" width="4" height="1" fill="#6a7080"/>

  <!-- ─── HOMBROS y TORSO ─── -->
  <rect x="9" y="14" width="14" height="1" fill="#3a4050"/>
  <rect x="8" y="15" width="16" height="1" fill="#6a7080"/>
  <rect x="10" y="16" width="12" height="6" fill="#6a7080"/>
  <!-- Highlights / shadows torso -->
  <rect x="10" y="16" width="1" height="6" fill="#9098a8"/>
  <rect x="21" y="16" width="1" height="6" fill="#3a4050"/>

  <!-- ─── REACTOR PECTORAL ─── -->
  <rect x="14" y="17" width="4" height="4" fill="#2a1810"/>
  <rect x="14" y="17" width="4" height="1" fill="#c25530"/>
  <rect x="14" y="20" width="4" height="1" fill="#c25530"/>
  <rect x="14" y="18" width="1" height="2" fill="#c25530"/>
  <rect x="17" y="18" width="1" height="2" fill="#c25530"/>
  <rect x="15" y="18" width="2" height="2" fill="#ffaa55"/>
  <rect x="15" y="18" width="1" height="1" fill="#ffe0a0"/>

  <!-- Cintura -->
  <rect x="10" y="22" width="12" height="1" fill="#3a4050"/>
  <!-- Pelvis -->
  <rect x="11" y="23" width="10" height="1" fill="#6a7080"/>
  <rect x="14" y="24" width="4" height="1" fill="#3a4050"/>

  <!-- ─── BRAZO IZQUIERDO ─── -->
  <rect x="6" y="15" width="2" height="2" fill="#3a4050"/>
  <rect x="6" y="17" width="2" height="3" fill="#6a7080"/>
  <rect x="6" y="17" width="1" height="3" fill="#9098a8"/>
  <rect x="7" y="20" width="2" height="1" fill="#3a4050"/>
  <rect x="7" y="21" width="2" height="3" fill="#6a7080"/>
  <rect x="7" y="21" width="1" height="3" fill="#9098a8"/>
  <rect x="6" y="24" width="3" height="2" fill="#9098a8"/>
  <rect x="6" y="26" width="3" height="1" fill="#3a4050"/>

  <!-- ─── BRAZO DERECHO ─── -->
  <rect x="24" y="15" width="2" height="2" fill="#3a4050"/>
  <rect x="24" y="17" width="2" height="3" fill="#6a7080"/>
  <rect x="25" y="17" width="1" height="3" fill="#3a4050"/>
  <rect x="23" y="20" width="2" height="1" fill="#3a4050"/>
  <rect x="23" y="21" width="2" height="3" fill="#6a7080"/>
  <rect x="24" y="21" width="1" height="3" fill="#3a4050"/>
  <rect x="23" y="24" width="3" height="2" fill="#9098a8"/>
  <rect x="23" y="26" width="3" height="1" fill="#3a4050"/>

  <!-- ─── PIERNAS ─── -->
  <rect x="12" y="24" width="3" height="3" fill="#6a7080"/>
  <rect x="17" y="24" width="3" height="3" fill="#6a7080"/>
  <rect x="12" y="24" width="1" height="3" fill="#9098a8"/>
  <rect x="17" y="24" width="1" height="3" fill="#9098a8"/>
  <rect x="14" y="24" width="1" height="3" fill="#3a4050"/>
  <rect x="19" y="24" width="1" height="3" fill="#3a4050"/>

  <!-- ─── BOTAS ─── -->
  <rect x="11" y="27" width="5" height="2" fill="#3a4050"/>
  <rect x="16" y="27" width="5" height="2" fill="#3a4050"/>
  <rect x="11" y="27" width="5" height="1" fill="#4d5360"/>
  <rect x="16" y="27" width="5" height="1" fill="#4d5360"/>
</svg>
